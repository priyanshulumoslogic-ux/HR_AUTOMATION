name: Send FDE assessment PDF follow-up (one-off)

# Manual only - no schedule. This sends the Forward Deployed Engineer
# assessment PDF (added after the first batch of FDE assessment emails
# already went out without one) to a fixed list of candidates hardcoded in
# assessment-mailer/src/send_fde_followup.py. Safe to re-run: it records
# each sent follow-up in the FDEFollowUpsSent sheet tab and skips anyone
# already there.
on:
  workflow_dispatch: {}

jobs:
  send-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: assessment-mailer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send FDE follow-up
        env:
          PYTHONUNBUFFERED: "1"
          READ_GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          READ_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_GMAIL_ADDRESS: ${{ secrets.SEND_GMAIL_ADDRESS }}
          SEND_GMAIL_APP_PASSWORD: ${{ secrets.SEND_GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS_2: ${{ secrets.GMAIL_ADDRESS_2 }}
          GMAIL_APP_PASSWORD_2: ${{ secrets.GMAIL_APP_PASSWORD_2 }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python src/send_fde_followup.py
