name: Send technical assessments (every 6h)

# Runs every 6 hours, offset 30 min after the Indeed scraper's :17 schedule
# so it isn't racing IMAP logins against it: 00:47, 06:47, 12:47, 18:47 UTC
# = 6:17 AM, 12:17 PM, 6:17 PM, 12:17 AM IST
on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assessment-mailer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send assessments
        env:
          PYTHONUNBUFFERED: "1"
          READ_GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          READ_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_GMAIL_ADDRESS: ${{ secrets.SEND_GMAIL_ADDRESS }}
          SEND_GMAIL_APP_PASSWORD: ${{ secrets.SEND_GMAIL_APP_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python src/main.py
