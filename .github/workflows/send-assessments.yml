name: Send technical assessments (every 5min)

# Polls every 5 minutes - the shortest interval GitHub Actions supports for
# scheduled workflows - so candidates get their assessment shortly after
# applying rather than waiting for a 6-hourly batch. GitHub doesn't
# guarantee exact timing for scheduled jobs (more so at high frequency, and
# during platform load), so treat this as "within a few minutes," not
# truly instant. Each run is independent and IMAP-searches from SINCE_DATE
# with dedup against the sheet, so a late or skipped run just gets caught
# by the next one - nothing is lost.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# If a run ever takes longer than 5 minutes, the next scheduled tick queues
# instead of starting in parallel - two overlapping runs could otherwise
# both read the dedup sheet before either had written to it and send the
# same candidate a duplicate assessment email.
concurrency:
  group: send-assessments
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assessment-mailer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send assessments
        env:
          PYTHONUNBUFFERED: "1"
          READ_GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          READ_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_GMAIL_ADDRESS: ${{ secrets.SEND_GMAIL_ADDRESS }}
          SEND_GMAIL_APP_PASSWORD: ${{ secrets.SEND_GMAIL_APP_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python src/main.py
