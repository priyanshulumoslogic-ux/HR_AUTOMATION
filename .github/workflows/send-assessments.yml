name: Send technical assessments (every 5min)

# The REAL 5-minute cadence is driven externally: an outside cron service
# (e.g. cron-job.org) calls this workflow's workflow_dispatch API endpoint
# every 5 minutes. GitHub's own `schedule:` trigger below is only a safety
# net at a much slower cadence - GitHub explicitly treats `schedule:` as
# best-effort and silently throttles high-frequency cron schedules (proven
# in practice: a "*/5 * * * *" schedule here was actually firing 1-3 hours
# apart), so it cannot be relied on alone for near-real-time delivery. See
# assessment-mailer/README.md for the external cron setup steps. Each run
# is independent and IMAP-searches from SINCE_DATE with dedup against the
# sheet, so a late or skipped tick just gets caught by the next one -
# nothing is lost either way.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# If a run ever takes longer than 5 minutes, the next scheduled tick queues
# instead of starting in parallel - two overlapping runs could otherwise
# both read the dedup sheet before either had written to it and send the
# same candidate a duplicate assessment email.
concurrency:
  group: send-assessments
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assessment-mailer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send assessments
        env:
          PYTHONUNBUFFERED: "1"
          READ_GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          READ_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_GMAIL_ADDRESS: ${{ secrets.SEND_GMAIL_ADDRESS }}
          SEND_GMAIL_APP_PASSWORD: ${{ secrets.SEND_GMAIL_APP_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python src/main.py
